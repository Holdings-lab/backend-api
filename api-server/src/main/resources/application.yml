server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:holdings}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jackson:
    serialization:
      indent_output: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Management endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

webhook:
  # FastAPI에서 Webhook 요청 시 Header에 포함되어야 하는 안전용 비밀키
  secret: ${WEBHOOK_SECRET}

firebase:
  # Firebase 서비스 계정 키 위치 (src/main/resources 아래에 배치)
  config-path: ${FIREBASE_CONFIG_PATH}

integration:
  ml:
    # data-ml Flask API 베이스 URL
    base-url: ${ML_API_BASE_URL:http://localhost:9000}
  finnhub:
    api-token: ${FINNHUB_API_TOKEN:}

insight:
  heatmap:
    impact-scale-factor: ${INSIGHT_HEATMAP_IMPACT_SCALE_FACTOR:10.0}
    ml-policy-weight: ${INSIGHT_HEATMAP_ML_POLICY_WEIGHT:100.0}
    threshold:
      very-high: ${INSIGHT_HEATMAP_THRESHOLD_VERY_HIGH:80.0}
      high: ${INSIGHT_HEATMAP_THRESHOLD_HIGH:60.0}
      medium: ${INSIGHT_HEATMAP_THRESHOLD_MEDIUM:40.0}

admin:
  # /admin API 보호용 공유 시크릿. 비어 있으면 /admin 요청은 전부 거부
  api-key: ${ADMIN_API_KEY:}
  notification-history:
    retention-days: ${NOTIFICATION_HISTORY_RETENTION_DAYS:30}
    cleanup-cron: ${NOTIFICATION_HISTORY_CLEANUP_CRON:0 0 3 * * *}

auth:
  email:
    from: ${MAIL_USERNAME}
    verify-code-expire-minutes: ${AUTH_VERIFY_CODE_EXPIRE_MINUTES:3}
    master-verification-code: ${MASTER_VERIFICATION_CODE:}

# JWT 세션 토큰 설정
# secret 은 HS256 서명키(최소 32바이트)
# 비워두면 부팅 시 임시 키 생성, 재시작 시 기존 토큰이 모두 무효화
jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:holdings-lab}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}

# 한국투자증권 Open API
kis:
  mock:
    app-key: ${KIS_MOCK_APP_KEY:}
    app-secret: ${KIS_MOCK_APP_SECRET:}
    cano: ${KIS_MOCK_CANO:}
    acnt-prdt-cd: ${KIS_MOCK_ACNT_PRDT_CD:01}
  api:
    mode: ${KIS_MOCK_API_MODE:paper}  # real | paper
    real-base-url: ${KIS_MOCK_REAL_BASE_URL:https://openapi.koreainvestment.com:9443}
    paper-base-url: ${KIS_MOCK_PAPER_BASE_URL:https://openapivts.koreainvestment.com:29443}
    timeout-seconds: ${KIS_MOCK_API_TIMEOUT:12}
    max-retries: ${KIS_MOCK_MAX_RETRIES:3}
  sync:
    schedule-cron: ${KIS_MOCK_SYNC_CRON:0 0 12,18 * * *}  # 매일 정오, 18시
    global-schedule-enabled: ${KIS_MOCK_SYNC_GLOBAL_SCHEDULE_ENABLED:false}

asset:
  session:
    heartbeat-ttl-minutes: ${ASSET_SESSION_HEARTBEAT_TTL_MINUTES:15}
    sync-throttle-minutes: ${ASSET_SESSION_SYNC_THROTTLE_MINUTES:5}
    refresh-lock-seconds: ${ASSET_SESSION_REFRESH_LOCK_SECONDS:10}
    background-sync-interval-ms: ${ASSET_BACKGROUND_SYNC_INTERVAL_MS:60000}
  status:
    watch-ratio: ${ASSET_STATUS_WATCH_RATIO:0.5}
    alert-ratio: ${ASSET_STATUS_ALERT_RATIO:1.0}
  batch:
    previous-day-snapshot-cron: ${ASSET_PREVIOUS_DAY_SNAPSHOT_CRON:0 30 8 * * *}
    all-time-high-scan-cron: ${ASSET_ATH_SCAN_CRON:0 30 6 * * 2-6}

# AES-256 암호화 설정 (한투 appkey/appsecret 및 민감 정보 저장)
crypto:
  aes:
    # 256-bit Base64-encoded AES key
    # 생성 방법: java -cp . com.project.server.service.security.CryptoService.generateBase64EncodedKey()
    # 또는 환경변수로 설정: export CRYPTO_AES_KEY="your-base64-encoded-256bit-key"
    key: ${CRYPTO_AES_KEY:}