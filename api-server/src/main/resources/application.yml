server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pwa_db}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jackson:
    serialization:
      indent_output: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Management endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

webhook:
  # FastAPI에서 Webhook 요청 시 Header에 포함되어야 하는 안전용 비밀키
  secret: ${WEBHOOK_SECRET}

firebase:
  # Firebase 서비스 계정 키 위치 (src/main/resources 아래에 배치)
  config-path: ${FIREBASE_CONFIG_PATH}

integration:
  ml:
    # data-ml Flask API 베이스 URL
    base-url: ${ML_API_BASE_URL:http://localhost:9000}

insight:
  heatmap:
    impact-scale-factor: ${INSIGHT_HEATMAP_IMPACT_SCALE_FACTOR:10.0}
    ml-policy-weight: ${INSIGHT_HEATMAP_ML_POLICY_WEIGHT:100.0}
    threshold:
      very-high: ${INSIGHT_HEATMAP_THRESHOLD_VERY_HIGH:80.0}
      high: ${INSIGHT_HEATMAP_THRESHOLD_HIGH:60.0}
      medium: ${INSIGHT_HEATMAP_THRESHOLD_MEDIUM:40.0}

admin:
  notification-history:
    retention-days: ${NOTIFICATION_HISTORY_RETENTION_DAYS:30}
    cleanup-cron: ${NOTIFICATION_HISTORY_CLEANUP_CRON:0 0 3 * * *}

auth:
  email:
    from: ${MAIL_USERNAME}
    verify-code-expire-minutes: ${AUTH_VERIFY_CODE_EXPIRE_MINUTES:3}

# CODEF API 설정
codef:
  mode: ${CODEF_MODE:test}  # test, demo, prod
  client-id: ${CODEF_CLIENT_ID}
  client-secret: ${CODEF_CLIENT_SECRET}
  sandbox:
    base-url: https://sandbox.codef.io
  demo:
    base-url: https://demo-api.codef.com
  prod:
    base-url: https://api.codef.com
  api:
    timeout-seconds: ${CODEF_API_TIMEOUT:12}
    max-retries: ${CODEF_MAX_RETRIES:3}
  sync:
    schedule-cron: ${CODEF_SYNC_CRON:0 0 12,18 * * *}  # 매일 정오, 18시
    batch-size: ${CODEF_SYNC_BATCH_SIZE:10}

# AES-256 암호화 설정 (CODEF 토큰 및 민감 정보 저장)
crypto:
  aes:
    # 256-bit Base64-encoded AES key
    # 생성 방법: java -cp . com.project.server.service.security.CryptoService.generateBase64EncodedKey()
    # 또는 환경변수로 설정: export CRYPTO_AES_KEY="your-base64-encoded-256bit-key"
    key: ${CRYPTO_AES_KEY:}