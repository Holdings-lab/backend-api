# 운영 시 backend-api/.env.docker 필수 (POSTGRES_PASSWORD 등)
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-holdings}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres}
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # Hibernate ddl-auto / Flyway 기동 시 250M이면 OOM으로 연결이 끊길 수 있음
          memory: 512M
    networks:
      - app-network

  api-server:
    image: ghcr.io/holdings-lab/api-server:latest
    container_name: api-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      llm.provider: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3.5-haiku-20241022}
      ML_API_BASE_URL: ${ML_API_BASE_URL:-http://data-ml:9000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      FIREBASE_CONFIG_PATH: /src/main/resources/serviceAccountKey.json
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      INTEGRATION_ML_BASE_URL: ${ML_API_BASE_URL:-http://data-ml:9000}
      HYPHEN_API_MODE: ${HYPHEN_API_MODE:-live}
      HYPHEN_USER_ID: ${HYPHEN_USER_ID:-}
      HYPHEN_HKEY: ${HYPHEN_HKEY:-}
      HYPHEN_OAUTH_ENABLED: ${HYPHEN_OAUTH_ENABLED:-true}
      HYPHEN_GUSTATION_ENABLED: ${HYPHEN_GUSTATION_ENABLED:-false}
      CRYPTO_AES_KEY: ${CRYPTO_AES_KEY:-}
      # 컨테이너 limit(768M) 안에서 힙을 고정해 cgroup OOM을 줄임
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${HIKARI_MIN_IDLE:-2}
    ports:
      - ${API_SERVER_PORT:-8080}:8080
    volumes:
      - ./api-server/src/main/resources/serviceAccountKey.json:/src/main/resources/serviceAccountKey.json
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    networks:
      - app-network

  data-ml:
    image: ghcr.io/holdings-lab/data-ml:latest
    container_name: data-ml
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_started
    env_file:
      - .env.docker
    environment:
      ML_API_PORT: 9000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SCHEDULE_MODE: ${SCHEDULE_MODE:-interval}
      INTERVAL_MINUTES: ${INTERVAL_MINUTES:-30}
      DAILY_HOUR: ${DAILY_HOUR:-9}
      DAILY_MINUTE: ${DAILY_MINUTE:-0}
      BIS_MAX_PAGES: ${BIS_MAX_PAGES:-5}
      CRAWL_SLEEP_SEC: ${CRAWL_SLEEP_SEC:-1}
      RUN_PIPELINE_ON_STARTUP: ${RUN_PIPELINE_ON_STARTUP:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://api-server:8080/api/internal/webhooks/events}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-30}
      LLM_RETRY_COUNT: ${LLM_RETRY_COUNT:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3.5-haiku-20241022}
      PYTHON_DOTENV_DISABLED: "1"
    ports:
      - ${ML_API_PORT:-9000}:9000
    volumes:
      - ./data-ml/data:/app/data
      - ./data-ml/training:/app/training
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/ml/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'     # 크롤링/Pandas/예측 연산 시 코어 1개로 상한선 차단
          memory: 800M    # 데이터가 적으므로 스왑을 최소화하며 연산할 수 있는 크기
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
