services:
  postgres:
    image: postgres:16-alpine
    container_name: pwa-postgres
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-holdings}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api-server:
    image: ghcr.io/holdings-lab/api-server:latest
    container_name: pwa-api-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-holdings}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      ML_API_BASE_URL: ${ML_API_BASE_URL:-http://data-ml:9000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      FIREBASE_CONFIG_PATH: /src/main/resources/serviceAccountKey.json
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      INTEGRATION_ML_BASE_URL: ${ML_API_BASE_URL:-http://data-ml:9000}
      CODEF_MODE: ${CODEF_MODE:-sandbox}
      CODEF_CLIENT_ID: ${CODEF_CLIENT_ID:-}
      CODEF_CLIENT_SECRET: ${CODEF_CLIENT_SECRET:-}
      CRYPTO_AES_KEY: ${CRYPTO_AES_KEY:-}
    ports:
      - ${API_SERVER_PORT:-8080}:8080
    volumes:
      - ./api-server/src/main/resources/serviceAccountKey.json:/src/main/resources/serviceAccountKey.json
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  data-ml:
    image: ghcr.io/holdings-lab/data-ml:latest
    container_name: pwa-data-ml
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_started
    env_file:
      - ./.env
    environment:
      ML_API_PORT: 9000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-holdings}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      SCHEDULE_MODE: ${SCHEDULE_MODE:-interval}
      INTERVAL_MINUTES: ${INTERVAL_MINUTES:-30}
      DAILY_HOUR: ${DAILY_HOUR:-9}
      DAILY_MINUTE: ${DAILY_MINUTE:-0}
      BIS_MAX_PAGES: ${BIS_MAX_PAGES:-5}
      CRAWL_SLEEP_SEC: ${CRAWL_SLEEP_SEC:-1}
      RUN_PIPELINE_ON_STARTUP: ${RUN_PIPELINE_ON_STARTUP:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://api-server:8080/api/internal/webhooks/events}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    ports:
      - ${ML_API_PORT:-9000}:9000
    volumes:
      - ./data-ml/data:/app/data
      - ./data-ml/training:/app/training
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/ml/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local