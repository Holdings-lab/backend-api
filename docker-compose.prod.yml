# 운영 시 backend-api/.env.docker 필수 (POSTGRES_PASSWORD 등)
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-holdings}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres}
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app-network

  api-server:
    image: ghcr.io/holdings-lab/api-server:latest
    container_name: api-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      llm.provider: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3.5-haiku-20241022}
      ML_API_BASE_URL: ${ML_API_BASE_URL:-http://data-ml:9000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      FIREBASE_CONFIG_PATH: /src/main/resources/serviceAccountKey.json
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      INTEGRATION_ML_BASE_URL: ${ML_API_BASE_URL:-http://data-ml:9000}
      KIS_MOCK_API_MODE: ${KIS_MOCK_API_MODE:-paper}
      KIS_MOCK_APP_KEY: ${KIS_MOCK_APP_KEY:-}
      KIS_MOCK_APP_SECRET: ${KIS_MOCK_APP_SECRET:-}
      KIS_MOCK_CANO: ${KIS_MOCK_CANO:-}
      KIS_MOCK_ACNT_PRDT_CD: ${KIS_MOCK_ACNT_PRDT_CD:-01}
      CRYPTO_AES_KEY: ${CRYPTO_AES_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-holdings-lab}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-14}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport -Djava.net.preferIPv4Stack=true}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${HIKARI_MIN_IDLE:-2}
    ports:
      - ${API_SERVER_PORT:-8080}:8080
    volumes:
      - ./api-server/src/main/resources/serviceAccountKey.json:/src/main/resources/serviceAccountKey.json
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    networks:
      - app-network

  data-ml:
    image: ghcr.io/holdings-lab/data-ml:latest
    container_name: data-ml
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_started
    env_file:
      - .env.docker
    environment:
      ML_API_PORT: 9000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SCHEDULE_MODE: ${SCHEDULE_MODE:-interval}
      INTERVAL_MINUTES: ${INTERVAL_MINUTES:-30}
      DAILY_HOUR: ${DAILY_HOUR:-9}
      DAILY_MINUTE: ${DAILY_MINUTE:-0}
      BIS_MAX_PAGES: ${BIS_MAX_PAGES:-5}
      CRAWL_SLEEP_SEC: ${CRAWL_SLEEP_SEC:-1}
      RUN_PIPELINE_ON_STARTUP: ${RUN_PIPELINE_ON_STARTUP:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://api-server:8080/api/internal/webhooks/events}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-30}
      LLM_RETRY_COUNT: ${LLM_RETRY_COUNT:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3.5-haiku-20241022}
      # 요약 시에만 ollama 사용
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_AUTO_MANAGE: ${OLLAMA_AUTO_MANAGE:-true}
      OLLAMA_AUTO_STOP: ${OLLAMA_AUTO_STOP:-true}
      OLLAMA_MEMORY_LIMIT: ${OLLAMA_MEMORY_LIMIT:-2g}
      OLLAMA_CONTAINER_NAME: ${OLLAMA_CONTAINER_NAME:-ollama}
      PYTHON_DOTENV_DISABLED: "1"
      ML_WORKER_ROOT: ${ML_WORKER_ROOT:-/opt/riseai/apps/ml-worker}
      # Docker 안에서는 호스트 venv 대신 컨테이너 python 사용
      ML_WORKER_PYTHON: ${ML_WORKER_PYTHON:-python}
      SIGNAL_OUTPUT_PATH: ${SIGNAL_OUTPUT_PATH:-/opt/riseai/data/predictions/qqq_latest_signal.json}
      SIGNAL_NEWS_FEATURES_PATH: ${SIGNAL_NEWS_FEATURES_PATH:-/opt/riseai/data/features/qqq/news_event_features.csv}
      SIGNAL_MARKET_FEATURES_PATH: ${SIGNAL_MARKET_FEATURES_PATH:-/opt/riseai/data/features/qqq/market_long_features.csv}
      SIGNAL_CRAWL_OUTPUT_PATH: ${SIGNAL_CRAWL_OUTPUT_PATH:-/opt/riseai/data/crawler/policy_updates_features.csv}
      CRAWLER_APP_ROOT: ${CRAWLER_APP_ROOT:-/opt/riseai/apps/crawler}
      SIGNAL_TIMEOUT_SEC: ${SIGNAL_TIMEOUT_SEC:-120}
      SIGNAL_CRAWL_TIMEOUT_SEC: ${SIGNAL_CRAWL_TIMEOUT_SEC:-1800}
      SIGNAL_REFRESH_FEATURES: ${SIGNAL_REFRESH_FEATURES:-true}
    ports:
      - ${ML_API_PORT:-9000}:9000
    volumes:
      - ./data-ml/data:/app/data
      - ./data-ml/training:/app/training
      - /opt/riseai/apps/ml-worker:/opt/riseai/apps/ml-worker:ro
      - /opt/riseai/apps/crawler:/opt/riseai/apps/crawler:ro
      - /opt/riseai/models:/opt/riseai/models:ro
      - /opt/riseai/data/predictions:/opt/riseai/data/predictions
      - /opt/riseai/data/features:/opt/riseai/data/features
      - /opt/riseai/data/crawler:/opt/riseai/data/crawler
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/ml/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'     # 크롤링/Pandas/예측 연산 시 코어 1개로 상한선 차단
          memory: 1536M   # LSTM+XGB subprocess(torch) 로딩 여유
    networks:
      - app-network

  # 평소 미기동. data-ml 이 요약 직전에 docker.sock 으로 start/stop.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ollama
    restart: "no"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - ${OLLAMA_PORT:-11434}:11434
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: ${OLLAMA_CPUS:-1.0}
          # 기본 2G + llama3.2:3b
          memory: ${OLLAMA_MEMORY_LIMIT:-2G}
    networks:
      - app-network

  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[ollama-pull] waiting for ollama..."
        for i in $$(seq 1 90); do
          if ollama list >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        echo "[ollama-pull] pulling model: $${OLLAMA_MODEL}"
        ollama pull "$${OLLAMA_MODEL}"
        echo "[ollama-pull] done"
        ollama list
    restart: "no"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  ollama-data:
    driver: local
